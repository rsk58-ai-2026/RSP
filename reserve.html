<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企画予約受付</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 16px; display: flex; justify-content: center; color: #333; }
    .card { background: white; padding: 24px 20px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); box-sizing: border-box; }
    h2 { margin-top: 0; font-size: 20px; text-align: center; color: #222; }
    .desc { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; background: #fdf6e2; padding: 10px; border-radius: 8px; }
    label { display: block; margin-top: 18px; font-weight: bold; font-size: 14px; color: #444; }
    input[type="text"] { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; }

    .people-display { width: 100%; padding: 12px 14px; margin-top: 6px; border: 1.5px solid #007bff; border-radius: 8px; background: #f8fbff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-sizing: border-box; }
    .people-val { font-size: 18px; font-weight: bold; color: #007bff; }
    .people-hint { font-size: 12px; color: #6c757d; }

    .slot-tabs-wrapper { overflow-x: auto; white-space: nowrap; margin-top: 8px; padding-bottom: 6px; }
    .tab-btn { display: inline-block; padding: 6px 14px; margin-right: 6px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid #dee2e6; background: #f8f9fa; color: #495057; cursor: pointer; }
    .tab-btn.active { background: #007bff; color: white; border-color: #007bff; }

    .slots-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; max-height: 280px; overflow-y: auto; }
    .slot-card { border: 1.5px solid #dee2e6; border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; background: white; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .slot-card.selected { border-color: #007bff; background: #007bff; color: white; }
    .slot-card.disabled { background: #f1f3f5; border-color: #e9ecef; color: #adb5bd; cursor: not-allowed; }
    .slot-time { font-size: 13px; font-weight: bold; }
    .slot-card.selected .slot-time { color: white; }
    .slot-rem { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 10px; display: inline-block; }
    .rem-ok { background: #e7f5ff; color: #1c7ed6; }
    .rem-none { background: #e9ecef; color: #868e96; }
    .slot-card.selected .slot-rem { background: rgba(255,255,255,0.25); color: white; }

    button.btn-primary { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #007bff; color: white; margin-top: 24px; }
    button:disabled { background: #bbb !important; cursor: not-allowed; }
    .btn-outline { width: 100%; padding: 11px; border: 1px solid #007bff; border-radius: 8px; background: transparent; color: #007bff; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .btn-danger { width: 100%; padding: 11px; border: 1px solid #dc3545; border-radius: 8px; background: transparent; color: #dc3545; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn-text { width: 100%; background: none; border: none; color: #888; font-size: 12px; margin-top: 14px; text-decoration: underline; cursor: pointer; }

    .keypad-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; z-index: 1000; }
    .keypad-sheet { background: white; width: 100%; max-width: 440px; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; }
    .keypad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .keypad-screen { font-size: 28px; font-weight: bold; color: #007bff; text-align: center; padding: 10px; background: #f8fbff; border-radius: 8px; margin-bottom: 14px; border: 1px solid #d0e2ff; }
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .num-key { padding: 14px 0; font-size: 22px; font-weight: bold; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; cursor: pointer; }
    .num-key-fn { font-size: 16px; background: #eef2f6; color: #495057; }
    .num-key-ok { background: #007bff; color: white; border-color: #007bff; font-size: 16px; }

    #completeArea, #editArea { display: none; }
    .qr-ticket-box { background: #fafafa; border: 2px dashed #007bff; padding: 16px; border-radius: 12px; margin: 16px 0; text-align: center; }
    #ticketQrCode { display: flex; justify-content: center; margin: 10px 0; }
    .id-badge { font-size: 28px; font-weight: bold; color: #007bff; letter-spacing: 2px; }
    .timer-banner { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 14px; font-weight: bold; }
    .timer-waiting { background: #e8f4fd; color: #0d6efd; border: 1px solid #b6d4fe; }
    .timer-alert { background: #fff3cd; color: #856404; border: 2px solid #ffc107; }
    .timer-active { background: #d1e7dd; color: #0f5132; border: 2px solid #198754; }
    .timer-ended { background: #e9ecef; color: #6c757d; }
    .ticket-info { text-align: left; background: #fafafa; border: 1px solid #eee; padding: 14px; border-radius: 8px; font-size: 14px; margin-top: 12px; }
    .ticket-info div { margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="card">
  <!-- 予約入力フォーム -->
  <div id="formArea">
    <h2>企画予約フォーム</h2>
    <div class="desc">
      個人情報の入力は不要です。任意のグループ名でご予約ください。<br>
      予約完了後に受付用のQRコードが発行されます。
    </div>

    <form id="reservationForm">
      <label>グループ名（呼び出し名）</label>
      <input type="text" id="groupName" placeholder="グループ名を入力してください" required maxlength="15">

      <label>参加人数</label>
      <div class="people-display" onclick="openKeypad('new')">
        <span class="people-val" id="peopleDisplay">2 名</span>
        <span class="people-hint">変更</span>
      </div>
      <input type="hidden" id="people" value="2名">

      <label>希望時間帯</label>
      <div id="slotTabs" class="slot-tabs-wrapper"></div>
      <div id="slotLoading" style="text-align:center; padding:16px; font-size:13px; color:#888;">空き枠を読み込み中...</div>
      <div id="slotsGrid" class="slots-grid"></div>
      <input type="hidden" id="selectedSlot" required>

      <button type="submit" id="submitBtn" class="btn-primary">予約を確定する</button>
    </form>
  </div>

  <!-- チケット画面 -->
  <div id="completeArea">
    <h2>予約チケット</h2>
    <div id="countdownBanner" class="timer-banner timer-waiting">計算中...</div>
    
    <div class="qr-ticket-box">
      <div style="font-size:12px; color:#555; font-weight:bold;">[受付提示用QRコード]</div>
      <div id="ticketQrCode"></div>
      <div class="id-badge" id="dispId">----</div>
      <div style="font-size:11px; color:#777;">受付スタッフにこの画面をご提示ください</div>
    </div>

    <div class="ticket-info">
      <div><b>時間帯:</b> <span id="dispSlot"></span></div>
      <div><b>グループ名:</b> <span id="dispGroup"></span></div>
      <div><b>人数:</b> <span id="dispPeople"></span></div>
    </div>

    <div style="background:#fff3cd; color:#856404; padding:10px; border-radius:8px; font-size:12px; margin-top:12px;">
      [ご注意]<br>
      充電切れや誤操作による画面紛失を防ぐため、この画面のスクリーンショットを保存しておくことを推奨します。
    </div>

    <div style="margin-top: 14px;">
      <button type="button" class="btn-outline" id="toEditBtn">予約内容を変更する</button>
      <button type="button" class="btn-danger" id="cancelBtn">予約をキャンセルする</button>
      <button type="button" class="btn-text" id="resetBtn">画面を閉じて新しく予約する</button>
    </div>
  </div>

  <!-- 変更フォーム -->
  <div id="editArea">
    <h2>予約内容の変更</h2>
    <form id="editForm">
      <label>グループ名</label>
      <input type="text" id="editGroupName" required maxlength="15">

      <label>参加人数</label>
      <div class="people-display" onclick="openKeypad('edit')">
        <span class="people-val" id="editPeopleDisplay">2 名</span>
        <span class="people-hint">変更</span>
      </div>
      <input type="hidden" id="editPeople" value="2名">

      <label>希望時間帯</label>
      <div id="editSlotTabs" class="slot-tabs-wrapper"></div>
      <div id="editSlotLoading" style="text-align:center; padding:16px; font-size:13px; color:#888;">最新枠を確認中...</div>
      <div id="editSlotsGrid" class="slots-grid"></div>
      <input type="hidden" id="editSelectedSlot" required>

      <button type="submit" id="updateBtn" class="btn-primary">変更を保存する</button>
      <button type="button" id="cancelEditBtn" class="btn-outline">戻る</button>
    </form>
  </div>
</div>

<!-- 人数テンキーモーダル -->
<div class="keypad-modal" id="keypadModal">
  <div class="keypad-sheet">
    <div class="keypad-header">
      <b style="font-size:15px;">参加人数の入力</b>
      <button type="button" style="background:none; border:none; font-size:15px; cursor:pointer;" onclick="closeKeypad()">閉じる</button>
    </div>
    <div class="keypad-screen" id="keypadScreen">2 名</div>
    <div class="keypad-grid">
      <button type="button" class="num-key" onclick="pressNumKey('1')">1</button>
      <button type="button" class="num-key" onclick="pressNumKey('2')">2</button>
      <button type="button" class="num-key" onclick="pressNumKey('3')">3</button>
      <button type="button" class="num-key" onclick="pressNumKey('4')">4</button>
      <button type="button" class="num-key" onclick="pressNumKey('5')">5</button>
      <button type="button" class="num-key" onclick="pressNumKey('6')">6</button>
      <button type="button" class="num-key" onclick="pressNumKey('7')">7</button>
      <button type="button" class="num-key" onclick="pressNumKey('8')">8</button>
      <button type="button" class="num-key" onclick="pressNumKey('9')">9</button>
      <button type="button" class="num-key num-key-fn" onclick="clearNumKey()">消去</button>
      <button type="button" class="num-key" onclick="pressNumKey('0')">0</button>
      <button type="button" class="num-key num-key-ok" onclick="submitKeypad()">確定</button>
    </div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw2G4hRQjWnz_NhotKxYeTqOlW6cS-AonuiHDrLFvhtbi0Ujl0HKomu6Mo5rqknFa5PTw/exec";
  const SECRET_KEY = "bunkasai2026";

  const params = new URLSearchParams(window.location.search);
  if (params.get("key") !== SECRET_KEY && !localStorage.getItem("my_bunkasai_ticket")) {
    window.location.href = "index.html";
  }

  let keypadTarget = "new";
  let keypadBuffer = "2";

  function openKeypad(target) {
    keypadTarget = target;
    const currentVal = (target === "new") ? document.getElementById("people").value : document.getElementById("editPeople").value;
    keypadBuffer = currentVal.replace("名", "").trim() || "1";
    document.getElementById("keypadScreen").textContent = `${keypadBuffer} 名`;
    document.getElementById("keypadModal").style.display = "flex";
  }
  function closeKeypad() { document.getElementById("keypadModal").style.display = "none"; }
  function pressNumKey(n) {
    if (keypadBuffer === "0" || keypadBuffer === "1" && keypadBuffer.length === 1) keypadBuffer = n;
    else if (keypadBuffer.length < 2) keypadBuffer += n;
    if (keypadBuffer === "0") keypadBuffer = "1";
    document.getElementById("keypadScreen").textContent = `${keypadBuffer} 名`;
  }
  function clearNumKey() { keypadBuffer = "1"; document.getElementById("keypadScreen").textContent = `${keypadBuffer} 名`; }
  function submitKeypad() {
    const finalVal = `${Number(keypadBuffer) || 1}名`;
    if (keypadTarget === "new") {
      document.getElementById("people").value = finalVal;
      document.getElementById("peopleDisplay").textContent = finalVal;
    } else {
      document.getElementById("editPeople").value = finalVal;
      document.getElementById("editPeopleDisplay").textContent = finalVal;
    }
    closeKeypad();
  }

  let rawSlotsData = [];
  function renderSlotUI(containerGrid, containerTabs, inputHidden, curSlot = null) {
    containerTabs.innerHTML = "";
    containerGrid.innerHTML = "";
    const hoursSet = new Set();
    rawSlotsData.forEach(item => {
      const match = item.slot.match(/^(\d{1,2}):/);
      if (match) hoursSet.add(`${match[1]}時台`);
    });
    const hours = Array.from(hoursSet);
    const tabs = ["すべて", ...hours];
    let activeTab = "すべて";

    function updateGrid() {
      containerGrid.innerHTML = "";
      const filtered = rawSlotsData.filter(item => {
        if (activeTab === "すべて") return true;
        const h = item.slot.match(/^(\d{1,2}):/);
        return h && `${h[1]}時台` === activeTab;
      });

      filtered.forEach(item => {
        const isCurrent = (curSlot && item.slot === curSlot);
        const isFull = (!isCurrent && item.remaining <= 0);
        const card = document.createElement("div");
        card.className = `slot-card ${isFull ? 'disabled' : ''} ${inputHidden.value === item.slot ? 'selected' : ''}`;

        let badgeClass = "rem-ok";
        let badgeText = `残り ${item.remaining} 枠`;
        if (isCurrent) { badgeClass = "rem-ok"; badgeText = "現在の選択"; }
        else if (isFull) { badgeClass = "rem-none"; badgeText = "満席"; }

        card.innerHTML = `<div class="slot-time">${item.slot}</div><div><span class="slot-rem ${badgeClass}">${badgeText}</span></div>`;
        if (!isFull) {
          card.onclick = () => {
            containerGrid.querySelectorAll(".slot-card").forEach(c => c.classList.remove("selected"));
            card.classList.add("selected");
            inputHidden.value = item.slot;
          };
        }
        containerGrid.appendChild(card);
      });
    }

    tabs.forEach(tabName => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = `tab-btn ${tabName === activeTab ? 'active' : ''}`;
      btn.textContent = tabName;
      btn.onclick = () => {
        activeTab = tabName;
        containerTabs.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        updateGrid();
      };
      containerTabs.appendChild(btn);
    });
    updateGrid();
  }

  async function loadSlots(isEdit = false, curSlot = null) {
    const loadEl = document.getElementById(isEdit ? "editSlotLoading" : "slotLoading");
    const gridEl = document.getElementById(isEdit ? "editSlotsGrid" : "slotsGrid");
    const tabsEl = document.getElementById(isEdit ? "editSlotTabs" : "slotTabs");
    const hiddenInput = document.getElementById(isEdit ? "editSelectedSlot" : "selectedSlot");
    loadEl.style.display = "block";
    gridEl.innerHTML = "";
    tabsEl.innerHTML = "";
    try {
      const res = await fetch(GAS_URL);
      rawSlotsData = await res.json();
      loadEl.style.display = "none";
      renderSlotUI(gridEl, tabsEl, hiddenInput, curSlot);
    } catch (e) {
      loadEl.textContent = "枠情報の読み込みに失敗しました。";
    }
  }

  let countdownInterval = null;
  function parseSlotTime(slotStr) {
    if (!slotStr) return null;
    const parts = slotStr.split("-").map(s => s.trim());
    if (parts.length < 2) return null;
    const [sh, sm] = parts[0].split(":").map(Number), [eh, em] = parts[1].split(":").map(Number);
    const now = new Date();
    return { start: new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0), end: new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0) };
  }

  function startCountdown(slotStr) {
    if (countdownInterval) clearInterval(countdownInterval);
    const banner = document.getElementById("countdownBanner");
    function update() {
      const times = parseSlotTime(slotStr);
      if (!times) return;
      const now = new Date();
      const diffStart = times.start - now, diffEnd = times.end - now;

      if (diffEnd <= 0) {
        banner.className = "timer-banner timer-ended";
        banner.innerHTML = "この予約枠の案内は終了しました";
      } else if (diffStart <= 0) {
        banner.className = "timer-banner timer-active";
        banner.innerHTML = "<b>[現在案内中] 受付へお越しください</b>";
      } else {
        const min = Math.floor(diffStart / 60000), sec = Math.floor((diffStart % 60000) / 1000);
        if (min < 15) {
          banner.className = "timer-banner timer-alert";
          banner.innerHTML = `<b>[まもなく開始] 受付前へお越しください（あと ${min}分${sec}秒）</b>`;
        } else {
          banner.className = "timer-banner timer-waiting";
          banner.innerHTML = `開始まで あと <b>${min}分</b>`;
        }
      }
    }
    update();
    countdownInterval = setInterval(update, 1000);
  }

  function showTicket(ticketData) {
    document.getElementById("formArea").style.display = "none";
    document.getElementById("editArea").style.display = "none";
    document.getElementById("completeArea").style.display = "block";

    document.getElementById("dispId").textContent = ticketData.id;
    document.getElementById("dispSlot").textContent = ticketData.slot;
    document.getElementById("dispGroup").textContent = ticketData.groupName;
    document.getElementById("dispPeople").textContent = ticketData.people;

    const qrContainer = document.getElementById("ticketQrCode");
    qrContainer.innerHTML = "";
    new QRCode(qrContainer, { text: ticketData.id, width: 140, height: 140 });

    startCountdown(ticketData.slot);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem("my_bunkasai_ticket");
    if (saved) {
      try { showTicket(JSON.parse(saved)); return; } catch (e) {}
    }
    loadSlots(false);
  });

  document.getElementById("reservationForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const slotVal = document.getElementById("selectedSlot").value;
    if (!slotVal) {
      alert("希望する時間帯を選択してください。");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "予約処理中...";

    const payload = {
      action: "create",
      groupName: document.getElementById("groupName").value.trim(),
      people: document.getElementById("people").value,
      slot: slotVal
    };

    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      const r = await res.json();
      if (r.success) {
        const ticket = { id: r.id, slot: r.slot, groupName: r.groupName, people: r.people };
        localStorage.setItem("my_bunkasai_ticket", JSON.stringify(ticket));
        showTicket(ticket);
      } else {
        alert(r.message);
        location.reload();
      }
    } catch (err) {
      alert("通信エラーが発生しました。");
      btn.disabled = false;
      btn.textContent = "予約を確定する";
    }
  });

  document.getElementById("cancelBtn").addEventListener("click", async () => {
    const saved = JSON.parse(localStorage.getItem("my_bunkasai_ticket"));
    if (!confirm(`予約（${saved.id}）をキャンセルしますか？`)) return;
    await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "cancel", id: saved.id }) });
    localStorage.removeItem("my_bunkasai_ticket");
    location.reload();
  });

  document.getElementById("toEditBtn").addEventListener("click", () => {
    const saved = JSON.parse(localStorage.getItem("my_bunkasai_ticket"));
    document.getElementById("editGroupName").value = saved.groupName;
    document.getElementById("editPeople").value = saved.people;
    document.getElementById("editPeopleDisplay").textContent = saved.people;
    document.getElementById("editSelectedSlot").value = saved.slot;
    document.getElementById("completeArea").style.display = "none";
    document.getElementById("editArea").style.display = "block";
    loadSlots(true, saved.slot);
  });

  document.getElementById("cancelEditBtn").addEventListener("click", () => {
    showTicket(JSON.parse(localStorage.getItem("my_bunkasai_ticket")));
  });

  document.getElementById("editForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const slotVal = document.getElementById("editSelectedSlot").value;
    if (!slotVal) { alert("時間帯を選択してください。"); return; }

    const saved = JSON.parse(localStorage.getItem("my_bunkasai_ticket"));
    const payload = {
      action: "update",
      id: saved.id,
      groupName: document.getElementById("editGroupName").value.trim(),
      people: document.getElementById("editPeople").value,
      slot: slotVal
    };

    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
    const r = await res.json();
    if (r.success) {
      const updated = { id: r.id, slot: r.slot, groupName: r.groupName, people: r.people };
      localStorage.setItem("my_bunkasai_ticket", JSON.stringify(updated));
      alert("予約内容を変更しました。");
      showTicket(updated);
    } else {
      alert(r.message);
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("予約チケット画面を閉じますか？")) {
      localStorage.removeItem("my_bunkasai_ticket");
      location.reload();
    }
  });
</script>
</body>
</html>
