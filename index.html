<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>文化祭受付システム</title>
  <!-- QR生成ライブラリ & QRスキャナーライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 16px; color: #333; }
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: white; padding: 14px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; gap: 10px; }
    h1 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 8px; }
    button { padding: 9px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-main { background: #007bff; color: white; }
    .btn-camera { background: #6f42c1; color: white; display: flex; align-items: center; gap: 6px; }
    .btn-qrshow { background: #fd7e14; color: white; }
    .btn-add { background: #28a745; color: white; }
    .btn-lock { background: transparent; border: 1px solid #adb5bd; color: #6c757d; }
    .btn-checkin { background: #e2e8f0; color: #4a5568; }
    .btn-checked { background: #28a745; color: white; }
    .btn-cancel { background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 4px 8px; }

    /* NEXT案内ボード */
    .next-banner { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 16px 20px; border-radius: 12px; box-shadow: 0 4px 12px rgba(30, 60, 114, 0.25); margin-bottom: 16px; }
    .next-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 8px; margin-bottom: 12px; }
    .next-title { font-size: 15px; font-weight: bold; }
    .next-time { font-size: 18px; font-weight: bold; color: #ffeb3b; }
    .next-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .next-card { background: rgba(255,255,255,0.12); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; background: white; padding: 14px 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; align-items: center; }
    input[type="text"], select { padding: 9px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    input[type="text"] { flex: 1; min-width: 180px; }

    .table-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 650px; }
    th { background: #f8fafc; padding: 12px 16px; border-bottom: 2px solid #edf2f7; color: #475569; }
    td { padding: 12px 16px; border-bottom: 1px solid #edf2f7; }
    tr.checked-row { background: #f0fdf4; }
    .id-tag { font-weight: bold; color: #007bff; font-family: monospace; background: #eaf2ff; padding: 3px 6px; border-radius: 6px; }

    /* モーダル各種 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: white; padding: 24px; border-radius: 14px; width: 100%; max-width: 420px; text-align: center; }

    /* ★ 二段階認証画面（オーバーレイ） */
    #authOverlay { position: fixed; inset: 0; background: #1a1e24; display: flex; justify-content: center; align-items: center; z-index: 999; }
    .auth-card { background: #252b36; padding: 26px; border-radius: 18px; color: white; width: 300px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .pass-dots { display: flex; justify-content: center; gap: 12px; margin: 16px 0 20px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #4a5568; }
    .dot.filled { background: #007bff; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key { background: #323b49; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; padding: 14px 0; cursor: pointer; }
    .key:active { background: #4a5568; }
    .key-fn { font-size: 15px; background: #2a323d; color: #a0aec0; }
    #patternStep { display: none; }
    #patternCanvas { background: #1a1e24; border-radius: 12px; touch-action: none; margin: 0 auto; display: block; }
  </style>
</head>
<body>

<!-- ★ 二段階認証画面 -->
<div id="authOverlay">
  <div class="auth-card">
    <!-- 第1段階：テンキー -->
    <div id="keypadStep">
      <h3 style="margin:0;">🔒 運営ログイン</h3>
      <p style="font-size:12px; color:#a0aec0; margin:6px 0;">パスコードを入力してください</p>
      <div class="pass-dots">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div><div class="dot" id="d4"></div>
      </div>
      <div id="lockMessage" style="font-size:13px; color:#f56565; height:18px; margin-bottom:10px;"></div>
      <div class="keypad" id="keypadButtons">
        <button class="key" onclick="pressKey('1')">1</button>
        <button class="key" onclick="pressKey('2')">2</button>
        <button class="key" onclick="pressKey('3')">3</button>
        <button class="key" onclick="pressKey('4')">4</button>
        <button class="key" onclick="pressKey('5')">5</button>
        <button class="key" onclick="pressKey('6')">6</button>
        <button class="key" onclick="pressKey('7')">7</button>
        <button class="key" onclick="pressKey('8')">8</button>
        <button class="key" onclick="pressKey('9')">9</button>
        <button class="key key-fn" onclick="clearPin()">C</button>
        <button class="key" onclick="pressKey('0')">0</button>
        <button class="key key-fn" onclick="backspacePin()">⌫</button>
      </div>
    </div>

    <!-- 第2段階：パターンロック -->
    <div id="patternStep">
      <h3 style="margin:0;">🔒 パターン認証</h3>
      <p style="font-size:12px; color:#a0aec0; margin:6px 0 14px;">パターンを一筆書きでなぞってください</p>
      <canvas id="patternCanvas" width="240" height="240"></canvas>
      <div id="patternMsg" style="font-size:13px; color:#e2e8f0; height:18px; margin-top:10px;"></div>
    </div>
  </div>
</div>

<!-- メインダッシュボード -->
<div class="header">
  <h1>📋 受付・予約管理</h1>
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <button class="btn-camera" onclick="openScannerModal()">📷 QRコードで受付</button>
    <button class="btn-qrshow" onclick="openCustomerQrModal()">📌 客用 予約QR表示</button>
    <button class="btn-add" onclick="openAddModal()">＋ 手動受付</button>
    <button class="btn-main" onclick="fetchData()">🔄 更新</button>
    <button class="btn-lock" onclick="logoutAdmin()">🔒 再ロック</button>
  </div>
</div>

<!-- NEXT案内ボード -->
<div class="next-banner">
  <div class="next-header">
    <div class="next-title">📢 次に案内するグループ</div>
    <div class="next-time" id="nextSlotText">計算中...</div>
  </div>
  <div class="next-groups" id="nextGroupsList"><div>確認中...</div></div>
</div>

<div class="controls">
  <input type="text" id="searchInput" placeholder="🔍 予約番号、グループ名で検索..." oninput="filterData()">
  <select id="slotFilter" onchange="filterData()"><option value="">すべての時間帯</option></select>
  <select id="statusFilter" onchange="filterData()">
    <option value="">全員表示</option><option value="未入場">未入場のみ</option><option value="入場済">入場済のみ</option>
  </select>
  <span id="countText" style="font-size:13px; font-weight:bold; margin-left:auto;">0 件</span>
</div>

<div class="table-card">
  <table>
    <thead>
      <tr><th>受付</th><th>予約番号</th><th>時間帯</th><th>グループ名</th><th>人数</th><th>予約日時</th><th>操作</th></tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="7" style="text-align:center; padding:30px; color:#888;">読み込み中...</td></tr>
    </tbody>
  </table>
</div>

<!-- 1. カメラQRスキャンモーダル -->
<div class="modal" id="scannerModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">📷 お客様のQRコードをスキャン</h3>
    <div id="reader" style="width:100%; border-radius:10px; overflow:hidden;"></div>
    <div id="scanResult" style="margin-top:10px; font-weight:bold; min-height:24px; color:#28a745;"></div>
    <button class="btn-cancel" style="margin-top:14px; width:100%; padding:10px;" onclick="closeScannerModal()">閉じる</button>
  </div>
</div>

<!-- 2. お客さま案内用QRコード表示モーダル -->
<div class="modal" id="customerQrModal">
  <div class="modal-content">
    <h2 style="margin-top:0;">📱 企画予約はこちら</h2>
    <p style="font-size:13px; color:#666;">カメラで読み取ってご予約ください</p>
    <div id="customerQrArea" style="display:flex; justify-content:center; margin:16px 0;"></div>
    <p style="font-size:12px; color:#999;">※この画面をお客様に向けて立てかけておくか、印刷してご活用ください。</p>
    <button class="btn-main" style="width:100%; padding:10px;" onclick="closeCustomerQrModal()">閉じる</button>
  </div>
</div>

<!-- 3. 手動追加モーダル -->
<div class="modal" id="addModal">
  <div class="modal-content" style="text-align:left;">
    <h3 style="margin-top:0;">➕ 当日手動受付</h3>
    <form id="addForm">
      <label style="font-size:13px; font-weight:bold;">グループ名</label>
      <input type="text" id="addGroup" placeholder="例: 手動受付1組目" required style="width:100%; margin:4px 0 10px; box-sizing:border-box;">
      <label style="font-size:13px; font-weight:bold;">人数</label>
      <select id="addPeople" style="width:100%; margin:4px 0 10px;">
        <option value="1名">1名</option><option value="2名">2名</option><option value="3名">3名</option><option value="4名">4名</option><option value="5名以上">5名以上</option>
      </select>
      <label style="font-size:13px; font-weight:bold;">時間帯</label>
      <select id="addSlot" style="width:100%; margin:4px 0 16px;"></select>
      <button type="submit" class="btn-add" style="width:100%; padding:10px;">予約作成</button>
      <button type="button" class="btn-cancel" style="width:100%; margin-top:8px; padding:8px;" onclick="closeAddModal()">キャンセル</button>
    </form>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw2G4hRQjWnz_NhotKxYeTqOlW6cS-AonuiHDrLFvhtbi0Ujl0HKomu6Mo5rqknFa5PTw/exec";
  const SECRET_KEY = "bunkasai2026"; // 予約画面を開くための合言葉
  const CORRECT_PIN = "2001";        // ★ テンキー暗証番号（4桁）
  const CORRECT_PATTERN = [2, 1, 0, 4, 6, 7, 8]; // ★ パターン認証配列

  const AUTH_KEY = "staff_auth_passed_v2";
  const LOCK_UNTIL_KEY = "keypad_lock_until";

  // ==========================================
  // ★ 二段階認証システム
  // ==========================================
  let currentPin = "";
  let failCount = 0;

  function updatePinDots() {
    for (let i = 1; i <= 4; i++) {
      document.getElementById(`d${i}`).className = (i <= currentPin.length) ? "dot filled" : "dot";
    }
  }

  function pressKey(num) {
    if (isKeypadLocked()) return;
    if (currentPin.length < 4) {
      currentPin += num;
      updatePinDots();
      if (currentPin.length === 4) {
        setTimeout(verifyPin, 150);
      }
    }
  }

  function clearPin() { currentPin = ""; updatePinDots(); }
  function backspacePin() { currentPin = currentPin.slice(0, -1); updatePinDots(); }

  function isKeypadLocked() {
    const lockUntil = localStorage.getItem(LOCK_UNTIL_KEY);
    if (lockUntil && Date.now() < Number(lockUntil)) {
      const remainSec = Math.ceil((Number(lockUntil) - Date.now()) / 1000);
      document.getElementById("lockMessage").textContent = `ロック中: 残り${remainSec}秒`;
      return true;
    }
    document.getElementById("lockMessage").textContent = "";
    return false;
  }

  function verifyPin() {
    if (currentPin === CORRECT_PIN) {
      failCount = 0;
      document.getElementById("keypadStep").style.display = "none";
      document.getElementById("patternStep").style.display = "block";
      drawPattern();
    } else {
      failCount++;
      clearPin();
      if (failCount >= 3) {
        const lockTime = Date.now() + 30000; // 3回ミスで30秒ロック
        localStorage.setItem(LOCK_UNTIL_KEY, lockTime);
        document.getElementById("lockMessage").textContent = "3回間違えました。30秒間ロックします。";
      } else {
        document.getElementById("lockMessage").textContent = `番号が違います（あと${3 - failCount}回）`;
      }
    }
  }

  // パターンロック
  const JUMP_TABLE = { "0-2": 1, "2-0": 1, "3-5": 4, "5-3": 4, "6-8": 7, "8-6": 7, "0-6": 3, "6-0": 3, "1-7": 4, "7-1": 4, "2-8": 5, "8-2": 5, "0-8": 4, "8-0": 4, "2-6": 4, "6-2": 4 };
  const canvas = document.getElementById("patternCanvas");
  const ctx = canvas.getContext("2d");
  const points = [];
  const coords = [45, 120, 195];
  for (let r = 0; r < 3; r++) { for (let c = 0; c < 3; c++) points.push({ id: points.length, x: coords[c], y: coords[r] }); }
  let isDrawing = false, selectedPoints = [], currentPos = { x: 0, y: 0 };

  function addPoint(p) {
    if (selectedPoints.some(sp => sp.id === p.id)) return;
    if (selectedPoints.length > 0) {
      const key = `${selectedPoints[selectedPoints.length - 1].id}-${p.id}`;
      if (JUMP_TABLE[key] !== undefined && !selectedPoints.some(sp => sp.id === JUMP_TABLE[key])) {
        selectedPoints.push(points[JUMP_TABLE[key]]);
      }
    }
    selectedPoints.push(p);
  }

  function drawPattern(isError = false) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (selectedPoints.length > 0) {
      ctx.beginPath();
      ctx.moveTo(selectedPoints[0].x, selectedPoints[0].y);
      for (let i = 1; i < selectedPoints.length; i++) ctx.lineTo(selectedPoints[i].x, selectedPoints[i].y);
      if (isDrawing && !isError) ctx.lineTo(currentPos.x, currentPos.y);
      ctx.strokeStyle = isError ? "#f56565" : "#4299e1"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.stroke();
    }
    points.forEach(p => {
      const isSel = selectedPoints.some(sp => sp.id === p.id);
      ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = isSel ? (isError ? "#f56565" : "#4299e1") : "#4a5568"; ctx.fill();
    });
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - rect.left, y: cy - rect.top };
  }

  canvas.addEventListener("mousedown", (e) => { isDrawing = true; selectedPoints = []; currentPos = getCanvasPos(e); checkCollision(); drawPattern(); });
  window.addEventListener("mousemove", (e) => { if (!isDrawing) return; currentPos = getCanvasPos(e); checkCollision(); drawPattern(); });
  window.addEventListener("mouseup", endPattern);
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); isDrawing = true; selectedPoints = []; currentPos = getCanvasPos(e); checkCollision(); drawPattern(); }, { passive: false });
  window.addEventListener("touchmove", (e) => { if (!isDrawing) return; currentPos = getCanvasPos(e); checkCollision(); drawPattern(); }, { passive: false });
  window.addEventListener("touchend", endPattern);

  function checkCollision() {
    for (let p of points) {
      if (Math.hypot(p.x - currentPos.x, p.y - currentPos.y) < 22) { addPoint(p); break; }
    }
  }

  function endPattern() {
    if (!isDrawing) return;
    isDrawing = false;
    const entered = selectedPoints.map(p => p.id);
    const ok = (entered.length === CORRECT_PATTERN.length) && entered.every((v, i) => v === CORRECT_PATTERN[i]);
    if (ok) {
      localStorage.setItem(AUTH_KEY, "true");
      document.getElementById("authOverlay").style.display = "none";
      fetchData();
      startTimer();
    } else {
      drawPattern(true);
      setTimeout(() => { selectedPoints = []; drawPattern(); }, 600);
    }
  }

  function logoutAdmin() {
    if (confirm("端末を再ロックしますか？")) {
      localStorage.removeItem(AUTH_KEY);
      location.reload();
    }
  }

  // ==========================================
  // ★ QRコード受付スキャナー（html5-qrcode）
  // ==========================================
  let html5QrCode = null;

  function openScannerModal() {
    document.getElementById("scannerModal").style.display = "flex";
    document.getElementById("scanResult").textContent = "QRコードを枠内にかざしてください";
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, onScanSuccess).catch(() => {
      document.getElementById("scanResult").textContent = "カメラの起動に失敗しました";
    });
  }

  async function onScanSuccess(decodedText) {
    html5QrCode.pause();
    document.getElementById("scanResult").textContent = `照合中... (${decodedText})`;

    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "checkin", id: decodedText.trim() })
      });
      const result = await res.json();
      if (result.success) {
        document.getElementById("scanResult").innerHTML = `🎉 受付完了！<br>${result.groupName} 様（${result.people}）`;
        fetchData();
        setTimeout(() => { closeScannerModal(); }, 1600);
      } else {
        alert(result.message);
        html5QrCode.resume();
      }
    } catch (e) {
      alert("通信エラーが発生しました");
      html5QrCode.resume();
    }
  }

  function closeScannerModal() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => { html5QrCode.clear(); }).catch(() => {});
    }
    document.getElementById("scannerModal").style.display = "none";
  }

  // ==========================================
  // ★ お客様用「予約QRコード」生成表示
  // ==========================================
  function openCustomerQrModal() {
    const qrArea = document.getElementById("customerQrArea");
    qrArea.innerHTML = "";
    // 現在のサイトURLから予約用ページへのURLを生成
    const baseUrl = window.location.href.split("?")[0].replace("index.html", "");
    const reserveUrl = `${baseUrl}reserve.html?key=${SECRET_KEY}`;
    
    new QRCode(qrArea, { text: reserveUrl, width: 220, height: 220 });
    document.getElementById("customerQrModal").style.display = "flex";
  }
  function closeCustomerQrModal() { document.getElementById("customerQrModal").style.display = "none"; }

  // ==========================================
  // ダッシュボード・定期更新
  // ==========================================
  let allReservations = [], allSlots = [], timerSec = 15;

  window.addEventListener('DOMContentLoaded', () => {
    setInterval(isKeypadLocked, 1000);
    if (localStorage.getItem(AUTH_KEY) === "true") {
      document.getElementById("authOverlay").style.display = "none";
      fetchData();
      startTimer();
    }
  });

  function startTimer() {
    setInterval(() => {
      timerSec--;
      if (timerSec <= 0) { fetchData(true); timerSec = 15; }
      updateNextBoard();
    }, 1000);
  }

  async function fetchData(isBg = false) {
    if (!isBg) document.getElementById("tableBody").innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#888;">更新中...</td></tr>';
    try {
      const res = await fetch(`${GAS_URL}?type=admin`);
      const json = await res.json();
      allReservations = json.reservations;
      allSlots = json.slots;
      const fSel = document.getElementById("slotFilter"), aSel = document.getElementById("addSlot");
      if (fSel.options.length <= 1) {
        allSlots.forEach(s => { fSel.add(new Option(s, s)); aSel.add(new Option(s, s)); });
      }
      filterData();
      updateNextBoard();
    } catch (e) {}
  }

  function filterData() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const sf = document.getElementById("slotFilter").value, stf = document.getElementById("statusFilter").value;
    const filtered = allReservations.filter(r => (r.id.toLowerCase().includes(q) || r.groupName.toLowerCase().includes(q)) && (!sf || r.slot === sf) && (!stf || r.status === stf));
    document.getElementById("countText").textContent = `${filtered.length} 件`;
    const tbody = document.getElementById("tableBody");
    if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:24px; color:#999;">予約なし</td></tr>'; return; }
    tbody.innerHTML = filtered.map(r => `
      <tr class="${r.status === '入場済' ? 'checked-row' : ''}">
        <td><button class="${r.status === '入場済' ? 'btn-checked' : 'btn-checkin'}" onclick="toggleCheckin('${r.id}')">${r.status === '入場済' ? '✓ 入場済' : '未入場'}</button></td>
        <td><span class="id-tag">${r.id}</span></td>
        <td><b>${r.slot}</b></td>
        <td>${r.groupName}</td>
        <td>${r.people}</td>
        <td style="font-size:12px; color:#888;">${r.time}</td>
        <td><button class="btn-cancel" onclick="cancelByAdmin('${r.id}')">取消</button></td>
      </tr>
    `).join('');
  }

  function parseSlotTime(slotStr) {
    if (!slotStr) return null;
    const parts = slotStr.split("-").map(s => s.trim());
    const [sh, sm] = parts[0].split(":").map(Number), [eh, em] = parts[1].split(":").map(Number);
    const now = new Date();
    return { start: new Date(now.getFullYear(), now.getMonth(), now.getDate(), sh, sm, 0), end: new Date(now.getFullYear(), now.getMonth(), now.getDate(), eh, em, 0) };
  }

  function updateNextBoard() {
    if (!allSlots.length) return;
    const now = new Date();
    let target = null;
    for (let s of allSlots) {
      const t = parseSlotTime(s);
      if (t && now < t.end) { target = s; break; }
    }
    document.getElementById("nextSlotText").textContent = target || "終了";
    const groups = allReservations.filter(r => r.slot === target);
    document.getElementById("nextGroupsList").innerHTML = groups.length ? groups.map(r => `
      <div class="next-card">
        <div><b>${r.groupName} (${r.people})</b><br><small style="color:#ddd;">ID: ${r.id}</small></div>
        ${r.status === '入場済' ? '<span style="color:#a5d6a7;">✓ 受付済</span>' : `<button class="btn-add" style="padding:4px 8px; font-size:12px;" onclick="toggleCheckin('${r.id}')">受付</button>`}
      </div>
    `).join('') : '<div style="font-size:13px; color:#ffeb3b;">※対象の予約はありません</div>';
  }

  async function toggleCheckin(id) {
    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "toggleCheckin", id: id }) });
    const json = await res.json();
    if (json.success) {
      const it = allReservations.find(r => r.id === id); if (it) it.status = json.status;
      filterData(); updateNextBoard();
    }
  }

  async function cancelByAdmin(id) {
    if (!confirm(`予約（${id}）を取り消しますか？`)) return;
    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "cancel", id: id }) });
    const json = await res.json();
    if (json.success) { allReservations = allReservations.filter(r => r.id !== id); filterData(); updateNextBoard(); }
  }

  function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
  function closeAddModal() { document.getElementById("addModal").style.display = "none"; }
  document.getElementById("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "create", groupName: document.getElementById("addGroup").value.trim(), people: document.getElementById("addPeople").value, slot: document.getElementById("addSlot").value }) });
    const json = await res.json();
    if (json.success) { alert(`当日予約を追加しました！\n発行番号: ${json.id}`); closeAddModal(); fetchData(); }
  });
</script>
</body>
</html>
